<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){
    if(this._init) return; this._init = true;
    (function(){
      var b=document.getElementById('burger'), m=document.getElementById('mmenu');
      if(b&&m){
        var setS=function(o){document.body.classList.toggle('menu-open',o);b.setAttribute('aria-expanded',o?'true':'false');m.setAttribute('aria-hidden',o?'false':'true');};
        b.addEventListener('click',function(){setS(!document.body.classList.contains('menu-open'));});
        m.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){setS(false);});});
        m.addEventListener('click',function(e){if(e.target===m)setS(false);});
        window.addEventListener('keydown',function(e){if(e.key==='Escape')setS(false);});
      }
    })();
    (function(){
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var fine = window.matchMedia('(pointer:fine)').matches;
      document.body.classList.add('ready');

      var cursor=document.getElementById('cursor');
      var chars = Array.prototype.slice.call(document.querySelectorAll('ch')).filter(function(c){return !c.classList.contains('sp');});

      if(reduce || !fine){ if(cursor) cursor.style.display='none'; return; }

      var mx=-1000,my=-1000,cx=-1000,cy=-1000;
      window.addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;});

      var rects=[];
      function measure(){
        rects = chars.map(function(c){
          var prev=c.style.transform; c.style.transform='none';
          var r=c.getBoundingClientRect();
          c.style.transform=prev;
          return {el:c, cx:r.left+r.width/2, cy:r.top+r.height/2, tx:0, ty:0, tr:0};
        });
      }
      window.addEventListener('resize',function(){clearTimeout(window.__rt);window.__rt=setTimeout(measure,200);});
      setTimeout(measure, 300);

      var R=130, MAX=15;
      function loop(){
        cx+=(mx-cx)*0.2; cy+=(my-cy)*0.2;
        if(cursor) cursor.style.transform='translate('+(cx-17)+'px,'+(cy-17)+'px)';
        for(var i=0;i<rects.length;i++){
          var p=rects[i];
          var dx=mx-p.cx, dy=my-p.cy;
          var dist=Math.sqrt(dx*dx+dy*dy);
          var gx=0,gy=0,gr=0;
          if(dist<R){
            var f=1-dist/R;
            gx=(dx/(dist||1))*f*MAX;
            gy=(dy/(dist||1))*f*MAX;
            gr=(dx/(dist||1))*f*4;
          }
          p.tx+=(gx-p.tx)*0.18; p.ty+=(gy-p.ty)*0.18; p.tr+=(gr-p.tr)*0.18;
          p.el.style.transform='translate('+p.tx.toFixed(2)+'px,'+p.ty.toFixed(2)+'px) rotate('+p.tr.toFixed(2)+'deg)';
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  }
}
